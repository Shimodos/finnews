name: Publish site

# Собирает новости, оценивает их через Claude и публикует страницу на GitHub Pages.
# Нужен секрет репозитория ANTHROPIC_API_KEY; без него страница выйдет без перевода и оценок.

on:
  schedule:
    # Время в UTC. По Киеву зимой: 07:00, 14:00, 18:00 и 23:30 (после закрытия биржи США).
    - cron: "0 5,12,16 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Одна публикация за раз; начатую не прерываем.
concurrency:
  group: pages
  cancel-in-progress: false

# Сборка и публикация — отдельные задания: если публикация споткнётся, её можно перезапустить
# отдельно, не вызывая Claude заново.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись базы в ветку data
    env:
      TZ: Europe/Kyiv # время на странице и границы дня в архиве
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # База хранит оценки, переводы и обзоры: без неё каждая сборка платила бы за всё заново,
      # а архив и словарик обнулялись бы. Она лежит в ветке data этого репозитория.
      - name: Restore database
        id: db
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:finnews.db > finnews.db
            echo "found=true" >> "$GITHUB_OUTPUT"
            ls -l finnews.db
          else
            echo "Ветки data ещё нет"
          fi

      # Переход со старого хранения: пока ветки data нет, берём базу из кэша прежних сборок.
      - name: Restore database from old cache
        if: steps.db.outputs.found != 'true'
        uses: actions/cache/restore@v6
        with:
          path: finnews.db
          key: finnews-db-
          restore-keys: finnews-db-

      - name: Install
        run: pip install .

      - name: Build site
        run: finnews update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST || 'VOO,VT,AAPL' }}
          # То же расписание, что в cron выше (UTC): по нему страница считает время до обновления.
          FINNEWS_SCHEDULE: "05:00,12:00,16:00,21:30"

      # Сразу после сборки, до выкладки: оплаченные оценки не теряются, даже если дальше что-то упадёт.
      # В ветке всегда один коммит (перезаписывается), чтобы репозиторий не рос от копий базы.
      - name: Save database
        run: |
          tmp="$(mktemp -d)"
          cp finnews.db "$tmp/"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finnews.db
          git commit -q -m "Database snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
